<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day Lanches Print Agent</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-brand"><span class="day">Day</span><span class="lanches">Lanches</span></div>
    <div class="header-sub">Print Agent</div>
  </div>

  <!-- Status -->
  <div class="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span class="status-text" id="status-text">Desconectado</span>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Config card -->
    <div class="card">
      <div class="card-title">Configurações</div>

      <div class="form-group">
        <label class="form-label">URL do Worker</label>
        <input type="text" class="form-input" id="cfg-worker-url" placeholder="https://day-lanches-worker...">
      </div>

      <div class="form-group">
        <label class="form-label">Token de impressão</label>
        <input type="password" class="form-input" id="cfg-token" placeholder="PRINT_AGENT_TOKEN">
      </div>

      <div class="form-group">
        <label class="form-label">Impressora</label>
        <select class="form-select" id="cfg-printer">
          <option value="__default__">Impressora padrão do Windows</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Tipo de papel</label>
        <select class="form-select" id="cfg-paper">
          <option value="80mm">Térmica 80mm</option>
          <option value="58mm">Térmica 58mm</option>
          <option value="A4">A4</option>
        </select>
      </div>

      <div class="toggle-row">
        <span class="toggle-label">Impressão automática</span>
        <label class="toggle">
          <input type="checkbox" id="cfg-auto-print" checked>
          <span class="toggle-track"></span>
          <span class="toggle-thumb"></span>
        </label>
      </div>

      <div class="toggle-row">
        <span class="toggle-label">Iniciar com Windows</span>
        <label class="toggle">
          <input type="checkbox" id="cfg-auto-launch">
          <span class="toggle-track"></span>
          <span class="toggle-thumb"></span>
        </label>
      </div>

      <div class="btn-row" style="margin-top: 14px">
        <button class="btn btn-primary" id="btn-save">Salvar configurações</button>
      </div>
    </div>

    <!-- Actions card -->
    <div class="card">
      <div class="card-title">Ações</div>

      <div class="btn-row" style="flex-direction: column; gap: 10px">
        <button class="btn btn-secondary" id="btn-test-conn" style="width:100%">
          <span>🔌</span> Testar conexão
        </button>
        <button class="btn btn-secondary" id="btn-test-print" style="width:100%">
          <span>🖨️</span> Testar impressão
        </button>
        <button class="btn btn-success btn-lg" id="btn-start" style="width:100%">
          <span>▶</span> Iniciar monitoramento
        </button>
        <button class="btn btn-danger btn-lg" id="btn-stop" style="width:100%; display: none">
          <span>⏹</span> Parar monitoramento
        </button>
      </div>

      <div class="stats-row" style="margin-top: 16px">
        <div class="stat-box">
          <div class="stat-val" id="stat-printed">0</div>
          <div class="stat-label">Impressos</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="stat-errors">0</div>
          <div class="stat-label">Erros</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="stat-last-check">--:--</div>
          <div class="stat-label">Última verificação</div>
        </div>
      </div>
    </div>

    <!-- Logs card -->
    <div class="card card-full">
      <div class="card-title">Logs</div>
      <div class="logs-area" id="logs-area">
        <div class="log-line"><span class="log-info">Pronto. Configure o token e inicie o monitoramento.</span></div>
      </div>
    </div>

  </div>

  <script src="receipt-template.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
