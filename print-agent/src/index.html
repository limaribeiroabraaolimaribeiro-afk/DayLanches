<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day Lanches Impressão</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Vista principal — o que a Dayane ve no dia a dia -->
  <div class="view" id="view-main">
    <div class="app-header">
      <span class="app-title">Day Lanches Impressão</span>
      <button type="button" class="icon-btn" id="btn-open-settings" title="Configuração avançada">⚙</button>
    </div>

    <div class="status-row">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-text" id="status-text">Verificando...</span>
    </div>

    <div class="field">
      <label class="field-label" for="cfg-printer">Impressora</label>
      <select class="field-select" id="cfg-printer">
        <option value="__default__">Impressora padrão do Windows</option>
      </select>
    </div>

    <button type="button" class="btn btn-secondary btn-block" id="btn-test-print">Testar impressão</button>

    <div class="options">
      <label class="option-row">
        <input type="checkbox" id="cfg-auto-print" checked>
        <span>Imprimir pedidos automaticamente</span>
      </label>
      <label class="option-row">
        <input type="checkbox" id="cfg-auto-launch">
        <span>Iniciar com o Windows</span>
      </label>
    </div>

    <p class="last-check">Último pedido verificado: <span id="last-check">--</span></p>
  </div>

  <!-- Vista de configuração avançada — preenchida uma unica vez na instalacao -->
  <div class="view" id="view-settings" style="display:none">
    <div class="app-header">
      <button type="button" class="icon-btn" id="btn-close-settings" title="Voltar">←</button>
      <span class="app-title">Configuração avançada</span>
    </div>

    <p class="settings-hint">Preenchido uma única vez, na instalação. Não é preciso mexer aqui no uso do dia a dia.</p>

    <div class="field">
      <label class="field-label" for="cfg-worker-url">URL do servidor</label>
      <input type="text" class="field-input" id="cfg-worker-url" placeholder="https://day-lanches-worker...">
    </div>

    <div class="field">
      <label class="field-label" for="cfg-token">Token do agente</label>
      <input type="password" class="field-input" id="cfg-token" placeholder="Cole aqui o token">
    </div>

    <div class="btn-row">
      <button type="button" class="btn btn-secondary" id="btn-test-conn">Testar conexão</button>
      <button type="button" class="btn btn-primary" id="btn-save-settings">Salvar</button>
    </div>

    <details class="log-details">
      <summary>Registro técnico</summary>
      <div class="logs-area" id="logs-area"></div>
    </details>
  </div>

  <script src="receipt-template.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
