<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Pedido recebido — Day Lanches</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
    }
    .ty-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      padding: 40px 28px;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .ty-logo { margin-bottom: 24px; }
    .logo-day     { font-size: 1.4rem; font-weight: 800; color: #FF6B00; }
    .logo-lanches { font-size: 1.4rem; font-weight: 800; color: #1a1a1a; }

    .ty-icon {
      width: 72px; height: 72px;
      background: #F0FDF4;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 2rem; color: #16a34a;
    }
    .ty-title {
      font-size: 1.5rem; font-weight: 800; color: #1a1a1a;
      margin-bottom: 8px;
    }
    .ty-order {
      font-size: .95rem; font-weight: 700; color: #FF6B00;
      margin-bottom: 12px;
    }
    .ty-msg {
      font-size: .88rem; color: #6B7280;
      line-height: 1.6; margin-bottom: 24px;
    }

    .ty-countdown {
      font-size: .82rem; color: #9CA3AF;
      margin-bottom: 20px;
      min-height: 20px;
    }
    .ty-countdown strong { color: #FF6B00; }

    .ty-btns {
      display: flex; flex-direction: column; gap: 12px;
    }
    .btn-wapp {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #25D366; color: #fff;
      font-family: inherit; font-size: .95rem; font-weight: 700;
      padding: 15px 24px; border-radius: 12px;
      border: none; cursor: pointer; text-decoration: none;
      transition: background .15s;
    }
    .btn-wapp:hover { background: #1ebe5a; }
    .btn-back {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: #F3F4F6; color: #374151;
      font-family: inherit; font-size: .9rem; font-weight: 600;
      padding: 13px 24px; border-radius: 12px;
      border: none; cursor: pointer; text-decoration: none;
      transition: background .15s;
    }
    .btn-back:hover { background: #E5E7EB; }
  </style>
</head>
<body>
  <div class="ty-card">
    <div class="ty-logo">
      <span class="logo-day">Day</span><span class="logo-lanches">Lanches</span>
    </div>
    <div class="ty-icon"><i class="fas fa-check"></i></div>
    <h1 class="ty-title">Pedido recebido!</h1>
    <p class="ty-order" id="ty-order"></p>
    <p class="ty-msg">
      Estamos aguardando a confirmação do pagamento.<br>
      Se precisar, fale com a Day Lanches pelo WhatsApp.
    </p>
    <p class="ty-countdown" id="ty-countdown"></p>
    <div class="ty-btns">
      <a id="btn-wapp" class="btn-wapp" href="#" target="_blank" rel="noopener">
        <i class="fab fa-whatsapp"></i> Falar com a Day Lanches
      </a>
      <a href="/" class="btn-back">
        <i class="fas fa-arrow-left"></i> Voltar ao cardápio
      </a>
    </div>
  </div>

  <script>
    const STORE_WHATSAPP = '5547991559926';

    /* Lê número do pedido: URL → localStorage */
    const params      = new URLSearchParams(window.location.search);
    const orderNumber = params.get('pedido') || params.get('order')
                      || localStorage.getItem('lastOrderNumber') || '';

    if (orderNumber) {
      document.getElementById('ty-order').textContent = 'Pedido ' + orderNumber;
    }

    /* Monta mensagem do WhatsApp */
    function buildWaMessage() {
      if (orderNumber) {
        return 'Olá, acabei de fazer um pedido pelo site da Day Lanches.'
          + '\n\nPedido: ' + orderNumber
          + '\nPagamento: online'
          + '\nAguardando confirmação.';
      }
      return 'Olá, acabei de fazer um pedido pelo site da Day Lanches e estou aguardando a confirmação do pagamento.';
    }

    function openWa() {
      const url = 'https://wa.me/' + STORE_WHATSAPP
                + '?text=' + encodeURIComponent(buildWaMessage());
      window.open(url, '_blank');
    }

    /* Atualiza href do botão */
    document.getElementById('btn-wapp').href =
      'https://wa.me/' + STORE_WHATSAPP
      + '?text=' + encodeURIComponent(buildWaMessage());

    /* Sobrescreve onclick para garantir que abre na aba correta */
    document.getElementById('btn-wapp').addEventListener('click', function(e) {
      e.preventDefault();
      openWa();
    });

    /* Countdown de 5 segundos */
    const countdownEl = document.getElementById('ty-countdown');
    let seconds = 5;

    function tick() {
      if (seconds > 0) {
        countdownEl.innerHTML =
          'Você será direcionado para o WhatsApp em <strong>' + seconds + 's</strong>.';
        seconds--;
        setTimeout(tick, 1000);
      } else {
        countdownEl.textContent = '';
        openWa();
      }
    }

    /* Inicia countdown com 1s de delay para o cliente ver a página */
    setTimeout(tick, 1000);
  </script>
</body>
</html>
