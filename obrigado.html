<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Pedido recebido — Day Lanches</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
    }
    .ty-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      padding: 40px 32px;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .ty-icon {
      width: 72px; height: 72px;
      background: #F0FDF4;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 2rem; color: #16a34a;
    }
    .ty-icon.waiting {
      background: #FFFBEB;
      color: #D97706;
    }
    .ty-title {
      font-size: 1.5rem; font-weight: 800; color: #1a1a1a;
      margin-bottom: 8px;
    }
    .ty-order {
      font-size: .95rem; font-weight: 700; color: #FF6B00;
      margin-bottom: 16px;
    }
    .ty-msg {
      font-size: .9rem; color: #6B7280;
      line-height: 1.6; margin-bottom: 28px;
    }
    .ty-msg.confirmed { color: #16a34a; font-weight: 600; }
    .btn-back {
      display: inline-flex; align-items: center; gap: 8px;
      background: #FF6B00; color: #fff;
      font-family: inherit; font-size: .95rem; font-weight: 700;
      padding: 14px 28px; border-radius: 12px;
      border: none; cursor: pointer; text-decoration: none;
      transition: background .15s;
    }
    .btn-back:hover { background: #E05A00; }
    .ty-logo {
      margin-bottom: 24px;
    }
    .logo-day     { font-size: 1.4rem; font-weight: 800; color: #FF6B00; }
    .logo-lanches { font-size: 1.4rem; font-weight: 800; color: #1a1a1a; }
  </style>
</head>
<body>
  <div class="ty-card">
    <div class="ty-logo">
      <span class="logo-day">Day</span><span class="logo-lanches">Lanches</span>
    </div>
    <div class="ty-icon" id="ty-icon"><i class="fas fa-check"></i></div>
    <h1 class="ty-title" id="ty-title">Pedido recebido!</h1>
    <p class="ty-order" id="ty-order"></p>
    <p class="ty-msg" id="ty-msg">Estamos aguardando a confirmação do pagamento.</p>
    <a href="/" class="btn-back"><i class="fas fa-arrow-left"></i> Voltar ao cardápio</a>
  </div>

  <script>
    const params   = new URLSearchParams(window.location.search);
    const order    = params.get('order') || '';
    const status   = params.get('status') || '';

    if (order) {
      document.getElementById('ty-order').textContent = 'Pedido ' + order;
    }

    if (status === 'pago') {
      document.getElementById('ty-icon').innerHTML = '<i class="fas fa-check-double"></i>';
      document.getElementById('ty-msg').textContent = 'Pagamento confirmado! Em breve sua loja iniciará o preparo.';
      document.getElementById('ty-msg').className = 'ty-msg confirmed';
    }
  </script>
</body>
</html>
