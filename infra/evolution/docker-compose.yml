version: "3.8"

services:
  # ── Evolution API ──
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: unless-stopped
    depends_on:
      - evolution-postgres
      - evolution-redis
    # Permite o container chamar o whatsapp-agent (processo PM2 rodando
    # direto no host, fora do Docker) via host.docker.internal.
    # Nao afeta nenhum outro servico da VPS.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVER_PORT=8080
      - SERVER_URL=https://${DOMAIN}

      # Banco de dados
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@evolution-postgres:5432/${POSTGRES_DB}
      # Reduz volume gravado no Postgres — nao precisamos de historico de chat/contatos
      - DATABASE_SAVE_DATA_CHATS=false
      - DATABASE_SAVE_DATA_CONTACTS=false
      - DATABASE_SAVE_DATA_HISTORIC=false
      - DATABASE_SAVE_DATA_LABELS=false

      # Redis desativado como cache: usado apenas pelo container evolution-redis em si,
      # sem interferir na sessao. Cache local em memoria no lugar.
      - CACHE_REDIS_ENABLED=false
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD}@evolution-redis:6379/0
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_LOCAL_ENABLED=true

      # Autenticação
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true

      # Instância
      - DEL_INSTANCE=false
      - DEL_TEMP_INSTANCES=false

      # Versao do WhatsApp Web reportada pelo Baileys — fixa a versao para evitar
      # o bug do /instance/connect retornando count:0 (visto na v2.2.3)
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1033773198

      # Logs
      - LOG_LEVEL=INFO
      - LOG_COLOR=true

      # Webhook global (desativado — cada instância configura o seu)
      - WEBHOOK_GLOBAL_ENABLED=false

      # QR Code
      - QRCODE_LIMIT=6

      # Fuso horário
      - TZ=${TZ}
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - evolution-net
    expose:
      - "8080"

  # ── PostgreSQL ──
  evolution-postgres:
    image: postgres:16-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TZ}
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    networks:
      - evolution-net
    # Sem ports: — não expõe para internet

  # ── Redis ──
  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      - evolution-net
    # Sem ports: — não expõe para internet

  # ── Caddy (HTTPS automático) ──
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    # Necessario para o Caddyfile resolver {$DOMAIN} dentro do container
    # (a interpolacao ${DOMAIN} deste docker-compose.yml nao alcanca o Caddy sozinha).
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - evolution-net

volumes:
  evolution_pgdata:
  evolution_redis:
  evolution_instances:
  evolution_store:
  caddy_data:
  caddy_config:

networks:
  evolution-net:
    driver: bridge
